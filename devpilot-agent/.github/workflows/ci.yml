name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --dev
      - run: uv run ruff check src scripts tests
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python scripts/secret_scan.py
      - run: uv run python scripts/check_markdown.py
