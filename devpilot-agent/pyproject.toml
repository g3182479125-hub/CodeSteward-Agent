[project]
name = "devpilot-agent"
version = "0.1.0"
description = "A personal development automation agent built around nanobot."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
devpilot = "devpilot.cli:main"

[project.entry-points."nanobot.tools"]
devpilot_inspect_project = "devpilot.nanobot_tools:InspectProjectTool"
devpilot_publish_artifact = "devpilot.nanobot_tools:PublishArtifactTool"
devpilot_search_code = "devpilot.nanobot_tools:SearchCodeTool"
devpilot_read_code = "devpilot.nanobot_tools:ReadCodeTool"
devpilot_propose_changeset = "devpilot.nanobot_tools:ProposeChangeSetTool"
devpilot_feature_delivery_propose = "devpilot.nanobot_tools:FeatureDeliveryProposeTool"
devpilot_execute_changeset = "devpilot.nanobot_tools:ExecuteChangeSetTool"
devpilot_verify_changeset = "devpilot.nanobot_tools:VerifyChangeSetTool"
devpilot_rollback_changeset = "devpilot.nanobot_tools:RollbackChangeSetTool"

[project.optional-dependencies]
fc-sandbox = [
    "e2b==2.31.0",
    "e2b-code-interpreter==2.8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "httpx2>=2.12,<3.0",
    "ruff>=0.9,<1.0",
    "pyright>=1.1.390,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devpilot"]
